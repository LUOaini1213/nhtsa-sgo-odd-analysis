name: ci

on:
  push:
  pull_request:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests (README/report numbers, bool parsing, check script)
        run: python -m pytest -q
      - name: Re-run the pipeline from data/raw
        run: python -I -B -X utf8 scripts/run_all.py
      - name: Tables are byte-identical to the committed versions
        run: python -I -B -X utf8 scripts/check_tables.py
      - name: No local machine paths in tracked text files
        shell: bash
        run: |
          if git grep -nIE '[A-Za-z]:[\/](Users|ProgramData)[\/]|/home/[a-z]|/Users/[A-Za-z]' -- . ':!.github/workflows/ci.yml'; then
            echo "local path found"; exit 1
          fi
